version: '3.8'

services:
  video-to-text:
    build: .
    container_name: video-to-text
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./video_tasks.db:/app/video_tasks.db
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
